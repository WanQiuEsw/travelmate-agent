[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travelmate-agent"
version = "0.1.0"
description = "LangChain travel planning agent"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
aliyun = [
    "alibabacloud-bailian20231229>=2.14.5",
]

[project.scripts]
travelmate = "travelmate.cli:main"

[tool.setuptools.packages.find]
include = ["travelmate*"]

[tool.setuptools.package-data]
travelmate = ["index.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
