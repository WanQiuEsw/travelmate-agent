<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · TravelMate</title>
<meta name="theme-color" content="#087f7a">
<link rel="icon" type="image/webp" href="/assets/visual/icon.webp">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 32px; }
  .auth-layout { width: min(1120px, 100%); display: grid; grid-template-columns: 1.1fr 1fr; align-items: stretch; border-radius: 32px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
  .auth-story { position: relative; min-height: 640px; background: #193c38; color: white; overflow: hidden; }
  .auth-story > img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  .auth-story::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, #193c381a 20%, #102c29e0); }
  .story-copy { position: absolute; z-index: 1; bottom: 44px; left: 40px; right: 40px; }
  .story-copy p { color: #fff; margin: 12px 0 0; }
  .story-copy .eyebrow { font-size: 12px; letter-spacing: .18em; font-weight: 600; }
  .story-copy h2 { font-size: clamp(32px, 3.2vw, 44px); line-height: 1.35; letter-spacing: -.04em; margin: 16px 0; }
  .story-copy small { display: block; margin-top: 28px; font-size: 12px; color: #e0e9df; }
  main { align-self: center; width: 100%; padding: 44px 48px; }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
  .login-brand img { width: 48px; height: 48px; border-radius: 14px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.5px; }
  .brand-caption { display: block; font-size: 12px; color: var(--muted); }
  p { color: var(--muted); }
  #description { margin: 0 0 22px; }
  label { display: grid; gap: 8px; margin: 18px 0; font-size: 14px; }
  input, button { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  input { background: var(--bg); color: var(--text); }
  input::placeholder { color: var(--muted); }
  input:focus-visible { outline-offset: 2px; }
  button { cursor: pointer; background: var(--accent); color: white; font-weight: 600; border-color: var(--accent); }
  button:hover:enabled { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  #toggle { margin-top: 12px; background: transparent; color: var(--accent-hover); border-color: var(--line); font-size: 14px; }
  #toggle:hover:enabled { background: var(--tint); }
  #error { color: #a32d2d; overflow-wrap: anywhere; font-size: 14px; }
  .login-note { margin: 22px 0 0; font-size: 12px; text-align: center; }
  [hidden] { display: none; }
  @media (max-width: 850px) { main { padding: 36px 28px; } .story-copy { left: 28px; right: 28px; } }
  @media (max-width: 650px) {
    body { padding: 20px; }
    .auth-layout { display: block; max-width: 460px; border-radius: 24px; }
    .auth-story { min-height: 190px; }
    .story-copy { bottom: 20px; left: 24px; }
    .story-copy h2 { font-size: 28px; margin: 8px 0 0; }
    .story-copy h2 br { display: none; }
    .story-copy > p:not(.eyebrow), .story-copy small { display: none; }
    main { padding: 28px 24px; }
    .login-brand { margin-bottom: 20px; }
  }
</style>
<div class="auth-layout">
<aside class="auth-story" aria-label="旅行灵感">
  <img src="/assets/visual/coast.webp" alt="阳光下的山海步道" width="1536" height="1024">
  <div class="story-copy"><p class="eyebrow">YOUR NEXT JOURNEY</p><h2>把向往，<br>变成行程。</h2><p>从一段对话开始，遇见下一段风景。</p><small>AI 生成的旅行意境图</small></div>
</aside>
<main>
  <div class="login-brand"><img src="/assets/visual/icon.webp" alt="" width="48" height="48"><div><h1>TravelMate</h1><span class="brand-caption">你的 AI 旅行搭子</span></div></div>
  <p id="description">登录后，继续规划你的旅行。</p>
  <form id="account-form">
    <label>用户名<input name="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="3–32 位字母、数字或下划线"></label>
    <label>密码<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password" placeholder="12–128 个字符"></label>
    <label class="registration" hidden>昵称<input name="display_name" maxlength="40" autocomplete="nickname" placeholder="希望我们怎么称呼你"></label>
    <label class="registration" hidden>邀请码<input name="invite_code" maxlength="128" autocomplete="off" spellcheck="false" placeholder="向邀请你的朋友获取"></label>
    <p id="error" role="alert"></p>
    <button id="submit" type="submit">登录</button>
  </form>
  <button id="toggle" type="button">有邀请码？注册账号</button>
  <p class="login-note">收藏每次向往，继续每段旅程。</p>
</main>
</div>
<script type="module">
  const form = document.querySelector('#account-form');
  const submit = document.querySelector('#submit');
  const toggle = document.querySelector('#toggle');
  const error = document.querySelector('#error');
  let registering = false;
  toggle.addEventListener('click', () => {
    registering = !registering;
    document.querySelectorAll('.registration').forEach(label => { label.hidden = !registering; });
    form.elements.invite_code.required = registering;
    form.elements.password.autocomplete = registering ? 'new-password' : 'current-password';
    submit.textContent = registering ? '使用邀请码注册' : '登录';
    toggle.textContent = registering ? '已有账号？返回登录' : '有邀请码？注册账号';
    document.querySelector('#description').textContent = registering ? '当前为邀请体验，请使用邀请码创建账号。' : '登录后，继续规划你的旅行。';
    error.textContent = '';
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    submit.disabled = toggle.disabled = true;
    error.textContent = '';
    const data = {username: form.elements.username.value.trim(), password: form.elements.password.value};
    if (registering) Object.assign(data, {display_name: form.elements.display_name.value.trim(), invite_code: form.elements.invite_code.value.trim()});
    try {
      const response = await fetch(registering ? '/auth/register' : '/auth/login', {
        method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-TravelMate-Request': '1'},
        body: JSON.stringify(data)
      });
      if (!response.ok) {
        const result = await response.json().catch(() => null);
        throw new Error(typeof result?.detail === 'string' ? result.detail : `登录服务暂时不可用（HTTP ${response.status}），请稍后重试`);
      }
      const session = await fetch('/auth/me', {credentials: 'same-origin', cache: 'no-store'});
      if (!session.ok) throw new Error('登录状态未保存，请确认浏览器允许本站 Cookie；如果刚完成注册，请返回登录重试');
      window.location.replace('/');
    } catch (failure) {
      error.textContent = failure instanceof TypeError
        ? '无法连接登录服务，请确认后端已启动并刷新页面重试；如果刚完成注册，可返回登录重试'
        : failure.message || '请求失败，请稍后重试';
    } finally {
      submit.disabled = toggle.disabled = false;
    }
  });
</script>
</html>
