<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TravelMate · 旅行规划助手</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f5f0; color: #203a32; font: 16px/1.7 system-ui, sans-serif; }
  main { max-width: 820px; margin: auto; padding: 28px 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 26px; }
  .intro { color: #5d7067; margin: 8px 0 24px; }
  button, textarea { font: inherit; }
  button { cursor: pointer; border: 1px solid #bdd0c3; border-radius: 10px; padding: 9px 16px; background: white; color: #244d3e; }
  button:disabled { cursor: wait; opacity: .6; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #82af91; outline-offset: 3px; }
  #messages { min-height: 260px; }
  .message { background: white; border: 1px solid #dce4dc; border-radius: 14px; padding: 16px 20px; margin: 12px 0; overflow-wrap: anywhere; }
  .message.user { background: #e3eee3; margin-left: 32px; }
  .message strong { display: block; font-size: 13px; color: #526d60; }
  .message p { margin: 8px 0 0; white-space: pre-wrap; }
  form { background: white; padding: 16px; border: 1px solid #dce4dc; border-radius: 14px; margin-top: 24px; }
  label { display: block; font-weight: 600; }
  textarea { width: 100%; resize: vertical; min-height: 110px; border: 1px solid #cbd8ce; border-radius: 8px; padding: 10px; margin: 8px 0; color: inherit; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #send { background: #245a44; color: white; border-color: #245a44; }
  #status { font-size: 14px; color: #526d60; }
  footer { margin-top: 16px; font-size: 13px; color: #5d7067; }
  @media (max-width: 480px) { h1 { font-size: 22px; } header { align-items: flex-start; } .message.user { margin-left: 12px; } }
</style>
<main>
  <header><h1>TravelMate <small>旅行助手</small></h1><button id="new" type="button">新对话</button></header>
  <p class="intro">聊聊你想去哪里，我们一起安排下一趟旅行。</p>
  <section id="messages" aria-label="对话内容" role="log" aria-live="polite">
    <article class="message"><strong>TravelMate</strong><p>告诉我出发地、目的地、日期、人数和预算吧。也可以先说说你喜欢怎样的旅行。</p></article>
  </section>
  <form id="form">
    <label for="input">你的旅行想法</label>
    <textarea id="input" maxlength="8000" required placeholder="例如：从上海出发，两个人去杭州玩三天，预算3000元，喜欢自然风景。"></textarea>
    <div class="actions"><span id="status" role="status">准备好了</span><button id="send" type="submit">发送</button></div>
  </form>
  <footer>预算与行程仅供参考，出行前请核实价格和开放时间。刷新页面会开始新对话；本地服务仍保留旧会话记录。</footer>
</main>
<script>
  const form = document.querySelector('#form');
  const input = document.querySelector('#input');
  const messages = document.querySelector('#messages');
  const status = document.querySelector('#status');
  const send = document.querySelector('#send');
  const newChat = document.querySelector('#new');
  let session = crypto.randomUUID();
  let busy = false;

  function appendMessage(label, text, user = false) {
    const article = document.createElement('article');
    article.className = user ? 'message user' : 'message';
    const name = document.createElement('strong');
    name.textContent = label;
    const body = document.createElement('p');
    // Model and user content are untrusted; display as plain text.
    body.textContent = text;
    article.append(name, body);
    messages.append(article);
    article.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }

  newChat.addEventListener('click', () => {
    if (busy) return;
    session = crypto.randomUUID();
    messages.replaceChildren();
    appendMessage('TravelMate', '新的旅行，从哪里开始？');
    status.textContent = '已开始新对话';
    input.focus();
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = newChat.disabled = true;
    input.disabled = true;
    appendMessage('你', text, true);
    status.textContent = '正在整理旅行建议，请稍候…';
    try {
      const response = await fetch('/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: session, message: text})
      });
      if (!response.ok) throw new Error('request failed');
      const result = await response.json();
      if (typeof result.answer !== 'string') throw new Error('invalid response');
      appendMessage('TravelMate', result.answer);
      input.value = '';
      status.textContent = '可以继续补充你的想法';
    } catch {
      status.textContent = '请求失败，请检查后端配置或网络。输入已保留，可重新发送。';
    } finally {
      busy = false;
      send.disabled = newChat.disabled = input.disabled = false;
      input.focus();
    }
  });
</script>
</html>
