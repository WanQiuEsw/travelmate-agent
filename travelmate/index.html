<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TravelMate · 旅行规划助手</title>
<style>
  :root { --bg: #f6f5ef; --surface: #fffefa; --text: #213d34; --muted: #586d63; --line: #d9e0d6; --green: #265c45; --tint: #e9eee4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.75 system-ui, "Microsoft YaHei", sans-serif; }
  main { max-width: 920px; margin: auto; padding: 28px 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 40px; height: 40px; padding: 8px; background: var(--green); border-radius: 12px; color: white; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
  header small { display: block; color: var(--muted); font-size: 12px; letter-spacing: 1px; font-weight: 500; }
  .hero { padding: 44px 0 20px; }
  .eyebrow { color: var(--green); font-size: 12px; letter-spacing: 2px; font-weight: 700; }
  h2 { font-size: clamp(28px, 5vw, 40px); line-height: 1.3; font-weight: 600; margin: 12px 0; text-wrap: balance; }
  .intro { color: var(--muted); margin: 0; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
  .suggestions button { font-size: 14px; background: transparent; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-top: 1px solid var(--line); }
  .toolbar label { flex-shrink: 0; font-size: 13px; color: var(--muted); }
  button, textarea, select { font: inherit; }
  button, select { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; background: var(--surface); color: var(--text); }
  select { min-width: 0; max-width: 100%; flex: 1; }
  button { cursor: pointer; transition: background .15s, border-color .15s; touch-action: manipulation; }
  button:hover:enabled { background: var(--tint); border-color: #92a895; }
  button:disabled { cursor: wait; opacity: .6; }
  :focus-visible { outline: 3px solid #699577; outline-offset: 3px; }
  #messages { min-height: 120px; padding-bottom: 8px; }
  .message { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; margin: 16px 0; overflow-wrap: anywhere; }
  .message.user { background: var(--tint); margin-left: 15%; border-color: transparent; }
  .speaker { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .5px; margin-bottom: 8px; }
  .content { min-width: 0; }
  .content.plain { white-space: pre-wrap; }
  .content p { margin: 8px 0; }
  .content h3 { font-size: 18px; margin: 24px 0 10px; }
  .content > :first-child { margin-top: 0; }
  .content > :last-child { margin-bottom: 0; }
  .content li { margin: 6px 0; }
  .content ul, .content ol { padding-left: 24px; }
  .content a { color: #215c82; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .content code { font: .9em/1.6 ui-monospace, monospace; background: var(--tint); padding: 2px 5px; border-radius: 4px; }
  .content pre { overflow: auto; background: var(--tint); padding: 16px; border-radius: 8px; }
  .content pre code { padding: 0; }
  .progress { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; background: var(--tint); font-size: 14px; }
  .progress ol { max-height: 280px; overflow-y: auto; margin-bottom: 0; }
  .progress summary { color: var(--green); }
  .references { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 13px; }
  summary { cursor: pointer; }
  .export-pdf { display: inline-block; margin-top: 18px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .table-scroll { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; min-width: 80px; }
  th { background: var(--tint); }
  form { background: var(--surface); padding: 20px; border: 1px solid #a6bba9; border-radius: 16px; margin-top: 20px; box-shadow: 0 6px 24px #213d3408; }
  label { display: block; font-weight: 600; font-size: 14px; }
  textarea { width: 100%; resize: vertical; min-height: 96px; max-height: 300px; border: 0; border-radius: 8px; padding: 10px 0; margin: 8px 0; color: inherit; background: transparent; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #send { background: var(--green); color: white; border-color: var(--green); min-width: 88px; flex-shrink: 0; }
  #send:hover:enabled { background: #184831; }
  #status { font-size: 13px; color: var(--muted); }
  footer { margin: 18px 0; font-size: 12px; color: var(--muted); text-align: center; }
  .skip { position: absolute; left: 16px; top: -100px; }
  .skip:focus { top: 8px; background: white; padding: 8px; z-index: 2; }
  @media (max-width: 480px) { main { padding: 20px 16px; } .hero { padding-top: 32px; } .message { padding: 16px; } .message.user { margin-left: 24px; } .actions { align-items: flex-end; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
<a class="skip" href="#input">跳到消息输入框</a>
<main>
  <header><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></svg><h1>TravelMate<small>你的旅行规划伙伴</small></h1></div><button id="new" type="button">＋ 新对话</button></header>
  <section class="hero" aria-labelledby="welcome"><span class="eyebrow">PLAN LESS. EXPLORE MORE.</span><h2 id="welcome">下一站，想去哪里？</h2><p class="intro">从一个想法出发，把路线、预算和沿途的期待慢慢安排好。</p>
    <div class="suggestions" aria-label="旅行灵感"><button type="button">杭州周末慢游</button><button type="button">带父母轻松出行</button><button type="button">帮我估算预算</button></div>
  </section>
  <div class="toolbar"><label for="history">我的对话</label><select id="history" aria-label="选择历史对话"><option value="">新对话</option></select></div>
  <section id="messages" aria-label="对话内容" role="log" aria-live="off">
    <article class="message"><strong>TravelMate</strong><p>告诉我出发地、目的地、日期、人数和预算吧。也可以先说说你喜欢怎样的旅行。</p></article>
  </section>
  <form id="form">
    <label for="input">你的旅行想法</label>
    <textarea id="input" maxlength="8000" required placeholder="例如：从上海出发，两个人去杭州玩三天，预算3000元，喜欢自然风景。"></textarea>
    <div class="actions"><span id="status" role="status" aria-live="polite">准备好了 · Ctrl / ⌘ + Enter 发送</span><button id="send" type="submit">发送 ↗</button></div>
  </form>
  <footer>预算与行程仅供参考，出行前请核实价格和开放时间。对话保存在本地服务中，刷新后可继续。</footer>
</main>
<script type="module">
  import {renderMarkdown} from '/assets/markdown.js';
  const form = document.querySelector('#form');
  const input = document.querySelector('#input');
  const messages = document.querySelector('#messages');
  const status = document.querySelector('#status');
  const send = document.querySelector('#send');
  const newChat = document.querySelector('#new');
  const historySelect = document.querySelector('#history');
  let session;
  try { session = localStorage.getItem('travelmate-session'); } catch {}
  if (!session || !/^[a-zA-Z0-9_-]{1,100}$/.test(session)) session = crypto.randomUUID();
  let busy = false;
  function addExport(body, messageId, sessionId = session) {
    if (!/^[a-f0-9]{32}$/.test(messageId || '')) return;
    const link = document.createElement('a');
    link.className = 'export-pdf';
    link.textContent = '导出这份回答为 PDF';
    link.href = '/sessions/' + encodeURIComponent(sessionId) + '/answers/' + messageId + '/pdf';
    link.target = '_blank';
    link.rel = 'noopener';
    body.append(link);
  }
  function showReply(body, text) { body.classList.remove('plain'); renderMarkdown(body, text); }

  function createProgress(reply) {
    const box = document.createElement('details');
    box.className = 'progress';
    box.open = true;
    const summary = document.createElement('summary');
    const steps = document.createElement('ol');
    steps.setAttribute('aria-label', '执行记录');
    box.append(summary, steps);
    reply.replaceChildren(box);
    const answer = document.createElement('div');
    reply.append(answer);
    const started = Date.now();
    let phase = '正在处理';
    const tick = () => { summary.textContent = phase + ' · 已用时 ' + Math.floor((Date.now() - started) / 1000) + ' 秒'; };
    tick();
    const timer = setInterval(tick, 1000);
    function add(text, sources = []) {
      const row = document.createElement('li');
      row.textContent = text;
      for (const source of sources) {
        const item = document.createElement('span');
        item.textContent = ' · ' + source.title;
        if (/^https?:\/\//i.test(source.url || '')) {
          const link = document.createElement('a');
          link.textContent = source.title;
          link.href = source.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          item.replaceChildren(document.createTextNode(' · '), link);
        }
        row.append(item);
      }
      steps.append(row);
    }
    add('正在读取本轮需求与对话上下文。');
    return {answer, add, finish(success) {
      clearInterval(timer);
      phase = success ? '已完成' : '已中断';
      tick();
    }};
  }

  function rememberSession() {
    try { localStorage.setItem('travelmate-session', session); } catch {}
  }

  async function refreshSessions() {
    const response = await fetch('/sessions');
    if (!response.ok) throw new Error('history unavailable');
    const data = await response.json();
    historySelect.replaceChildren(new Option('新对话', ''));
    for (const item of data.sessions) historySelect.add(new Option(item.title, item.session_id));
    historySelect.value = [...historySelect.options].some(o => o.value === session) ? session : '';
  }

  async function loadConversation(id) {
    if (busy) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    status.textContent = '正在恢复对话…';
    try {
      const response = await fetch('/sessions/' + encodeURIComponent(id));
      if (!response.ok) throw new Error('history unavailable');
      const data = await response.json();
      session = id;
      rememberSession();
      input.value = '';
      messages.replaceChildren();
      for (const item of data.messages) {
        const body = appendMessage(item.role === 'user' ? '你' : 'TravelMate', item.content, item.role === 'user');
        if (item.role === 'assistant') addExport(body, item.message_id, id);
      }
      if (!data.messages.length) appendMessage('TravelMate', '告诉我目的地、日期和预算，我们开始规划。');
      status.textContent = data.interrupted ? '上次回复未完成，可继续补充需求。' : '对话已恢复，可以继续聊';
    } catch {
      status.textContent = '历史对话加载失败，请刷新后重试。';
    } finally {
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = false;
    }
  }

  historySelect.addEventListener('change', () => {
    if (historySelect.value) loadConversation(historySelect.value);
    else newChat.click();
  });

  function appendMessage(label, text, user = false) {
    const article = document.createElement('article');
    article.className = user ? 'message user' : 'message';
    const name = document.createElement('span');
    name.className = 'speaker';
    name.textContent = label;
    const body = document.createElement('div');
    body.className = 'content plain';
    if (user) body.textContent = text;
    else showReply(body, text);
    article.append(name, body);
    messages.append(article);
    return body;
  }

  newChat.addEventListener('click', () => {
    if (busy) return;
    session = crypto.randomUUID();
    rememberSession();
    input.value = '';
    historySelect.value = '';
    messages.replaceChildren();
    appendMessage('TravelMate', '新的旅行，从哪里开始？');
    status.textContent = '已开始新对话';
    input.focus();
  });

  for (const button of document.querySelectorAll('.suggestions button')) {
    button.addEventListener('click', () => {
      if (busy) return;
      input.value = button.textContent;
      input.focus();
    });
  }
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && !event.isComposing) {
      event.preventDefault(); form.requestSubmit();
    }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    input.disabled = true;
    appendMessage('你', text, true);
    status.textContent = '正在整理旅行建议，请稍候…';
    const reply = appendMessage('TravelMate', '正在整理回复，完成排版后将显示在这里…');
    const progress = createProgress(reply);
    reply.setAttribute('aria-busy', 'true');
    let generating = false;
    let done = false;
    try {
      const response = await fetch('/chat/stream', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: session, message: text})
      });
      if (!response.ok) throw new Error('request failed');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const packet = await reader.read();
        buffer += decoder.decode(packet.value, {stream: !packet.done});
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const event = frame.split('\n').find(line => line.startsWith('event: '))?.slice(7);
          const dataLine = frame.split('\n').find(line => line.startsWith('data: '));
          if (!dataLine) continue;
          const data = JSON.parse(dataLine.slice(6));
          if (event === 'error') throw new Error(data.text);
          if (event === 'status') {
            status.textContent = data.text;
            progress.add(data.text, data.sources);
          }
          if (event === 'token') {
            if (!generating) progress.add('正在结合查询结果组织回答与参考来源，完成排版后展示。');
            generating = true;
            status.textContent = '正在生成回复并整理排版…';
          }
          if (event === 'done') {
            showReply(progress.answer, data.answer);
            addExport(progress.answer, data.message_id);
            reply.setAttribute('aria-busy', 'false');
            done = true;
          }
        }
        if (packet.done) break;
      }
      if (!done) throw new Error('incomplete stream');
      input.value = '';
      status.textContent = '可以继续补充你的想法';
      refreshSessions().catch(() => { status.textContent = '回复已保存，历史列表暂时无法更新。'; });
    } catch {
      progress.add('请求中断，已保留本次执行记录。');
      showReply(progress.answer, '本次回复未完成，请稍后重试。');
      reply.setAttribute('aria-busy', 'false');
      status.textContent = '请求失败，请检查后端配置或网络。输入已保留，可重新发送。';
    } finally {
      progress.finish(done);
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = input.disabled = false;
      input.focus();
    }
  });
  rememberSession();
  async function initialize() {
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    try { await refreshSessions(); }
    catch { status.textContent = '历史列表加载失败，仍可尝试恢复当前对话。'; }
    busy = false;
    await loadConversation(session);
  }
  initialize();
</script>
</html>
