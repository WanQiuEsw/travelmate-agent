<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TravelMate · 旅行规划助手</title>
<style>
  :root { --bg: #fff; --surface: #fff; --text: #243247; --muted: #69778b; --line: #e5eaf0; --accent: #3568a8; --tint: #eff4fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.75 system-ui, "Microsoft YaHei", sans-serif; }
  button, textarea { font: inherit; }
  button { cursor: pointer; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; min-height: 44px; touch-action: manipulation; }
  button:hover:enabled { background: var(--tint); }
  button:disabled { opacity: .55; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; padding: 28px 16px; background: #f6f8fb; border-right: 1px solid var(--line); overflow-y: auto; }
  .sidebar > summary { display: none; }
  .sidebar:not([open]) > :not(summary) { display: block; }
  @media (min-width: 701px) { .sidebar::details-content { content-visibility: visible; display: block; } }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand svg { width: 32px; height: 32px; color: var(--accent); }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.5px; }
  .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  #new { width: 100%; text-align: left; color: var(--accent); }
  .history-label { color: var(--muted); font-size: 12px; margin: 28px 12px 10px; }
  #history { border: 0; padding: 0; margin: 0; min-width: 0; }
  #history button { display: block; width: 100%; margin: 4px 0; border: 0; background: transparent; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #history button:hover, #history button[aria-current="true"] { background: #e7eef7; color: var(--accent); }
  .history-row { display: flex; align-items: center; gap: 4px; }
  #history .history-row .history-open { flex: 1; min-width: 0; }
  #history .history-row .history-delete { width: auto; flex-shrink: 0; font-size: 12px; padding: 6px; }
  .history-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
  .history-tools input, .history-tools select { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #history .history-tools button { width: auto; border: 1px solid var(--line); font-size: 12px; }
  .history-group > summary { padding: 8px; font-size: 13px; color: var(--muted); }
  .history-empty { padding: 0 12px; font-size: 13px; color: var(--muted); }
  main { margin-left: 260px; height: 100dvh; display: flex; flex-direction: column; min-width: 0; }
  .topbar { padding: 18px 32px; font-size: 14px; color: var(--muted); border-bottom: 1px solid #f2f4f7; }
  .conversation { flex: 1; overflow-y: auto; min-height: 0; padding: 20px 28px; }
  .chat-width { width: 100%; max-width: 800px; margin: 0 auto; }
  .hero { display: none; text-align: center; padding: 24px 0; }
  main:has(#messages:empty) .conversation { display: flex; align-items: center; }
  main:has(#messages:empty) .hero { display: block; }
  h2 { font-size: clamp(23px, 3vw, 30px); line-height: 1.5; font-weight: 600; margin: 0 0 12px; }
  .intro { color: var(--muted); margin: 0; }
  .message { margin: 12px 0 28px; overflow-wrap: anywhere; }
  .message.user { width: fit-content; max-width: 85%; margin-left: auto; background: var(--tint); padding: 12px 18px; border-radius: 18px 18px 4px 18px; }
  .speaker { display: block; font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .user .speaker { color: var(--muted); text-align: right; }
  .content { min-width: 0; }
  .content.plain { white-space: pre-wrap; }
  .content p { margin: 0 0 10px; }
  .content h3 { font-size: 18px; margin: 24px 0 10px; }
  .content > :first-child { margin-top: 0; }
  .content > :last-child { margin-bottom: 0; }
  .content li { margin: 6px 0; }
  .content ul, .content ol { padding-left: 24px; }
  .content a { color: #215c82; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .content code { font: .9em/1.6 ui-monospace, monospace; background: var(--tint); padding: 2px 5px; border-radius: 4px; }
  .content pre { overflow: auto; background: var(--tint); padding: 16px; border-radius: 8px; }
  .content pre code { padding: 0; }
  .progress { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; background: var(--tint); font-size: 14px; }
  .progress ol { max-height: 280px; overflow-y: auto; margin-bottom: 0; }
  .progress summary { color: var(--accent); }
  .references { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 13px; }
  summary { cursor: pointer; }
  .export-pdf { display: inline-block; margin-top: 18px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .table-scroll { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; min-width: 80px; }
  th { background: var(--tint); }
  .entry-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .entry-tools button { min-height: 36px; padding: 5px 12px; font-size: 13px; color: var(--accent); background: var(--tint); }
  .quick-fill { margin-bottom: 12px; max-height: 42dvh; overflow-y: auto; }
  .quick-fill summary { color: var(--accent); font-size: 13px; padding: 8px 0; }
  #trip-form { border: 0; border-radius: 0; box-shadow: none; padding: 8px 0; }
  .trip-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .trip-grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .trip-grid input { min-width: 0; width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; color: var(--text); background: var(--surface); }
  .trip-note { margin: 8px 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) { .trip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .composer { padding: 12px 28px max(12px, env(safe-area-inset-bottom)); background: var(--surface); }
  form { padding: 14px 18px; border: 1px solid #d9e1eb; border-radius: 20px; box-shadow: 0 4px 20px #24324706; }
  form:focus-within { border-color: #91afd2; }
  .input-label, .skip { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .skip:focus { width: auto; height: auto; clip-path: none; background: white; padding: 8px; z-index: 3; }
  textarea { display: block; width: 100%; resize: vertical; min-height: 64px; max-height: 180px; border: 0; padding: 4px 0; color: inherit; background: transparent; }
  textarea:focus-visible { outline: 0; }
  textarea::placeholder { color: #8591a2; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .keyboard-hint, #status, footer { font-size: 12px; color: var(--muted); }
  #status { margin: 8px 4px 0; min-height: 21px; }
  #send { background: var(--accent); color: white; border: 0; border-radius: 12px; }
  #send:hover:enabled { background: #28578f; }
  footer { text-align: center; margin-top: 4px; font-size: 11px; }
  @media (max-width: 700px) {
    .sidebar { position: relative; width: 100%; padding: 0 16px; max-height: 45dvh; border-right: 0; border-bottom: 1px solid var(--line); }
    .sidebar > summary { display: block; padding: 12px 0; cursor: pointer; font-size: 14px; color: var(--accent); }
    .sidebar:not([open]) > :not(summary) { display: none; }
    .brand { display: none !important; }
    #new { margin-bottom: 8px; }
    .history-label { margin-top: 12px; }
    body { height: 100dvh; display: flex; flex-direction: column; }
    main { margin-left: 0; height: auto; flex: 1; min-height: 0; }
    .topbar { display: none; }
    .conversation { padding: 16px; }
    .composer { padding: 10px 12px max(10px, env(safe-area-inset-bottom)); }
    .message.user { max-width: 92%; }
    .keyboard-hint { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<a class="skip" href="#input">跳到消息输入框</a>
<details class="sidebar" id="sidebar">
  <summary>☰ 对话记录</summary>
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></svg><h1>TravelMate<small>智能旅游助手</small></h1></div>
  <button id="new" type="button">＋ 开启新对话</button>
  <p class="history-label">最近对话</p>
  <fieldset id="history" aria-label="历史对话"><p class="history-empty">暂无历史对话</p></fieldset>
</details>
<main>
  <header class="topbar">TravelMate · 你的智能旅游助手</header>
  <div class="conversation"><div class="chat-width">
    <section class="hero" aria-labelledby="welcome"><h2 id="welcome">你好，我是智能旅游助手 TravelMate</h2><p class="intro">想去哪里走走？一起规划你的下一段旅程。</p>
    </section>
    <section id="messages" aria-label="对话内容" role="log" aria-live="off"></section>
  </div></div>
  <div class="composer"><div class="chat-width">
    <details class="quick-fill" id="quick-fill">
      <summary>快速填写 · 人数 / 日期 / 地点 / 预算</summary>
      <form id="trip-form">
        <div class="trip-grid">
          <label>【人数】<input name="people" type="number" min="1" max="100" step="1" required placeholder="例如 2" inputmode="numeric"></label>
          <label>【出发日期】<input name="date" type="date" required></label>
          <label>【出发地】<input name="origin" required maxlength="80" placeholder="例如 福建厦门" list="trip-cities"></label>
          <label>【目的地】<input name="destination" required maxlength="80" placeholder="例如 北京" list="trip-cities"></label>
          <label>【总预算 / 元】<input name="budget" type="number" min="1" max="10000000" step="1" required placeholder="例如 3000" inputmode="numeric"></label>
          <label>【游玩天数】<input name="days" type="number" min="1" max="365" step="1" required placeholder="例如 3" inputmode="numeric"></label>
        </div>
        <datalist id="trip-cities"><option value="福建厦门"><option value="北京"><option value="上海"><option value="杭州"><option value="成都"><option value="广州"><option value="西安"></datalist>
        <p class="trip-note">地点可选择常用城市，也可自行输入。预算为所有人的总预算。</p>
        <button type="submit">填入对话框</button>
      </form>
    </details>
    <form id="form">
      <div class="entry-tools"><button id="preset" type="button">试试预设示例 ↗</button></div>
      <label class="input-label" for="input">你的旅行想法</label>
      <textarea id="input" maxlength="8000" required placeholder="自由描述旅行想法，或使用上方的快速填写 / 预设示例…"></textarea>
      <div class="actions"><span class="keyboard-hint">Enter 发送 · Ctrl + Enter 换行</span><button id="send" type="submit">发送 ↑</button></div>
    </form>
    <p id="status" role="status" aria-live="polite">准备好了，随时出发</p>
    <footer>行程建议仅供参考，出行前请核实价格和开放时间。</footer>
  </div></div>
</main>
<script type="module">
  import {renderMarkdown} from '/assets/markdown.js';
  const form = document.querySelector('#form');
  const input = document.querySelector('#input');
  const messages = document.querySelector('#messages');
  const status = document.querySelector('#status');
  const send = document.querySelector('#send');
  const newChat = document.querySelector('#new');
  const historySelect = document.querySelector('#history');
  let session;
  try { session = localStorage.getItem('travelmate-session'); } catch {}
  if (!session || !/^[a-zA-Z0-9_-]{1,100}$/.test(session)) session = crypto.randomUUID();
  let busy = false;
  const selectedSessions = new Set();
  function addExport(body, messageId, sessionId = session) {
    if (!/^[a-f0-9]{32}$/.test(messageId || '')) return;
    const link = document.createElement('a');
    link.className = 'export-pdf';
    link.textContent = '导出这份回答为 PDF';
    link.href = '/sessions/' + encodeURIComponent(sessionId) + '/answers/' + messageId + '/pdf';
    link.target = '_blank';
    link.rel = 'noopener';
    body.append(link);
  }
  function showReply(body, text) { body.classList.remove('plain'); renderMarkdown(body, text); }

  function createProgress(reply) {
    const box = document.createElement('details');
    box.className = 'progress';
    box.open = true;
    const summary = document.createElement('summary');
    const steps = document.createElement('ol');
    steps.setAttribute('aria-label', '执行记录');
    box.append(summary, steps);
    reply.replaceChildren(box);
    const answer = document.createElement('div');
    reply.append(answer);
    const started = Date.now();
    let phase = '正在处理';
    const tick = () => { summary.textContent = phase + ' · 已用时 ' + Math.floor((Date.now() - started) / 1000) + ' 秒'; };
    tick();
    const timer = setInterval(tick, 1000);
    function add(text, sources = []) {
      const row = document.createElement('li');
      row.textContent = text;
      for (const source of sources) {
        const item = document.createElement('span');
        item.textContent = ' · ' + source.title;
        if (/^https?:\/\//i.test(source.url || '')) {
          const link = document.createElement('a');
          link.textContent = source.title;
          link.href = source.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          item.replaceChildren(document.createTextNode(' · '), link);
        }
        row.append(item);
      }
      steps.append(row);
    }
    add('正在读取本轮需求与对话上下文。');
    return {answer, add, finish(success) {
      clearInterval(timer);
      phase = success ? '已完成' : '已中断';
      tick();
    }};
  }

  function rememberSession() {
    try { localStorage.setItem('travelmate-session', session); } catch {}
  }

  async function refreshSessions() {
    const response = await fetch('/sessions');
    if (!response.ok) throw new Error('history unavailable');
    const data = await response.json();
    historySelect.replaceChildren();
    const existing = new Set(data.sessions.map(item => item.session_id));
    for (const id of selectedSessions) if (!existing.has(id)) selectedSessions.delete(id);
    if (data.sessions.length) {
      const tools = document.createElement('div');
      tools.className = 'history-tools';
      const count = document.createElement('span');
      count.textContent = '已选 ' + selectedSessions.size + ' 个对话';
      const all = document.createElement('button');
      all.type = 'button'; all.textContent = '全选 / 取消';
      all.addEventListener('click', () => {
        if (busy) return;
        if (selectedSessions.size === data.sessions.length) selectedSessions.clear();
        else for (const item of data.sessions) selectedSessions.add(item.session_id);
        refreshSessions().catch(() => { status.textContent = '对话列表加载失败'; });
      });
      const remove = document.createElement('button');
      remove.type = 'button'; remove.textContent = '删除所选';
      remove.addEventListener('click', () => manageSessions('/sessions/delete', [...selectedSessions]));
      const group = document.createElement('input');
      group.maxLength = 60; group.placeholder = '输入分组名称，留空移出分组';
      group.setAttribute('aria-label', '分组名称');
      const existingGroups = document.createElement('select');
      existingGroups.setAttribute('aria-label', '选择已有分组');
      const option = document.createElement('option'); option.value = ''; option.textContent = '选择已有分组';
      existingGroups.append(option);
      for (const name of new Set(data.sessions.map(item => item.group).filter(Boolean))) {
        const choice = document.createElement('option'); choice.value = name; choice.textContent = name;
        existingGroups.append(choice);
      }
      existingGroups.addEventListener('change', () => { group.value = existingGroups.value; });
      const move = document.createElement('button');
      move.type = 'button'; move.textContent = '移动所选';
      move.addEventListener('click', () => manageSessions('/sessions/group', [...selectedSessions], group.value.trim()));
      tools.append(count, all, remove, existingGroups, group, move);
      historySelect.append(tools);
    }
    const groups = new Map();
    for (const item of data.sessions) {
      const groupName = item.group || '未分组';
      if (!groups.has(groupName)) {
        const section = document.createElement('details'); section.className = 'history-group'; section.open = true;
        const title = document.createElement('summary'); title.textContent = groupName;
        section.append(title); groups.set(groupName, section); historySelect.append(section);
      }
      const row = document.createElement('div'); row.className = 'history-row';
      const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
      checkbox.checked = selectedSessions.has(item.session_id);
      checkbox.setAttribute('aria-label', '选择对话：' + item.title);
      checkbox.addEventListener('change', () => {
        if (busy) return;
        if (checkbox.checked) selectedSessions.add(item.session_id); else selectedSessions.delete(item.session_id);
        const count = historySelect.querySelector('.history-tools span');
        if (count) count.textContent = '已选 ' + selectedSessions.size + ' 个对话';
      });
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'history-open';
      button.textContent = item.title; button.title = item.title;
      button.setAttribute('aria-current', String(item.session_id === session));
      button.addEventListener('click', async () => {
        if (busy) return;
        await loadConversation(item.session_id);
        refreshSessions().catch(() => {});
        document.querySelector('#sidebar').open = false;
      });
      const remove = document.createElement('button');
      remove.type = 'button'; remove.className = 'history-delete'; remove.textContent = '删除';
      remove.setAttribute('aria-label', '删除对话：' + item.title);
      remove.addEventListener('click', () => manageSessions('/sessions/delete', [item.session_id]));
      row.append(checkbox, button, remove); groups.get(groupName).append(row);
    }
    if (!data.sessions.length) {
      const empty = document.createElement('p');
      empty.className = 'history-empty';
      empty.textContent = '暂无历史对话';
      historySelect.append(empty);
    }
  }

  async function manageSessions(url, ids, group) {
    if (busy) return;
    if (!ids.length) { status.textContent = '请先勾选对话'; return; }
    const deleting = url === '/sessions/delete';
    if (deleting && !confirm('确定删除这 ' + ids.length + ' 个对话？删除后无法恢复。')) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    try {
      const response = await fetch(url, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_ids: ids, ...(deleting ? {} : {group})})
      });
      if (!response.ok) throw new Error('update failed');
      for (const id of ids) selectedSessions.delete(id);
      if (deleting && ids.includes(session)) resetConversation();
      await refreshSessions();
      status.textContent = deleting ? '所选对话已删除' : (group ? '已移动到分组：' + group : '已移出分组');
    } catch {
      status.textContent = '操作未能完成，请刷新列表后重试。';
    } finally {
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = false;
    }
  }

  async function loadConversation(id) {
    if (busy) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    status.textContent = '正在恢复对话…';
    try {
      const response = await fetch('/sessions/' + encodeURIComponent(id));
      if (!response.ok) throw new Error('history unavailable');
      const data = await response.json();
      session = id;
      rememberSession();
      input.value = '';
      messages.replaceChildren();
      for (const item of data.messages) {
        const body = appendMessage(item.role === 'user' ? '你' : 'TravelMate', item.content, item.role === 'user');
        if (item.role === 'assistant') addExport(body, item.message_id, id);
      }

      status.textContent = data.interrupted ? '上次回复未完成，可继续补充需求。' : '对话已恢复，可以继续聊';
    } catch {
      status.textContent = '历史对话加载失败，请刷新后重试。';
    } finally {
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = false;
    }
  }

  function appendMessage(label, text, user = false) {
    const article = document.createElement('article');
    article.className = user ? 'message user' : 'message';
    const name = document.createElement('span');
    name.className = 'speaker';
    name.textContent = label;
    const body = document.createElement('div');
    body.className = 'content plain';
    if (user) body.textContent = text;
    else showReply(body, text);
    article.append(name, body);
    messages.append(article);
    return body;
  }

  function resetConversation() {
    session = crypto.randomUUID();
    rememberSession();
    input.value = '';
    for (const button of historySelect.querySelectorAll('[aria-current]')) button.setAttribute('aria-current', 'false');
    document.querySelector('#sidebar').open = false;
    messages.replaceChildren();

    status.textContent = '已开始新对话';
    input.focus();
  }
  newChat.addEventListener('click', () => { if (!busy) resetConversation(); });

  input.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
    if (event.ctrlKey || event.metaKey) {
      event.preventDefault();
      input.setRangeText('\n', input.selectionStart, input.selectionEnd, 'end');
      input.dispatchEvent(new Event('input', {bubbles: true}));
      return;
    }
    if (event.shiftKey || event.altKey) return;
    event.preventDefault();
    form.requestSubmit();
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    input.disabled = true;
    appendMessage('你', text, true);
    status.textContent = '正在整理旅行建议，请稍候…';
    const reply = appendMessage('TravelMate', '正在整理回复，完成排版后将显示在这里…');
    const progress = createProgress(reply);
    reply.setAttribute('aria-busy', 'true');
    let generating = false;
    let done = false;
    try {
      const response = await fetch('/chat/stream', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: session, message: text})
      });
      if (!response.ok) throw new Error('request failed');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const packet = await reader.read();
        buffer += decoder.decode(packet.value, {stream: !packet.done});
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const event = frame.split('\n').find(line => line.startsWith('event: '))?.slice(7);
          const dataLine = frame.split('\n').find(line => line.startsWith('data: '));
          if (!dataLine) continue;
          const data = JSON.parse(dataLine.slice(6));
          if (event === 'error') throw new Error(data.text);
          if (event === 'status') {
            status.textContent = data.text;
            progress.add(data.text, data.sources);
          }
          if (event === 'token') {
            if (!generating) progress.add('正在结合查询结果组织回答与参考来源，完成排版后展示。');
            generating = true;
            status.textContent = '正在生成回复并整理排版…';
          }
          if (event === 'done') {
            showReply(progress.answer, data.answer);
            addExport(progress.answer, data.message_id);
            reply.setAttribute('aria-busy', 'false');
            done = true;
          }
        }
        if (packet.done) break;
      }
      if (!done) throw new Error('incomplete stream');
      input.value = '';
      status.textContent = '可以继续补充你的想法';
      refreshSessions().catch(() => { status.textContent = '回复已保存，历史列表暂时无法更新。'; });
    } catch {
      progress.add('请求中断，已保留本次执行记录。');
      showReply(progress.answer, '本次回复未完成，请稍后重试。');
      reply.setAttribute('aria-busy', 'false');
      status.textContent = '请求失败，请检查后端配置或网络。输入已保留，可重新发送。';
    } finally {
      progress.finish(done);
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = input.disabled = false;
      input.focus();
    }
  });
  rememberSession();
  async function initialize() {
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    try { await refreshSessions(); }
    catch { status.textContent = '历史列表加载失败，仍可尝试恢复当前对话。'; }
    busy = false;
    send.disabled = newChat.disabled = historySelect.disabled = false;
    if (historySelect.querySelector('[aria-current="true"]')) await loadConversation(session);
  }
  initialize();
</script>
<script id="quick-fill-script">
  const tripForm = document.querySelector('#trip-form');
  const tripInput = document.querySelector('#input');
  const tripPanel = document.querySelector('#quick-fill');
  function fillTripDraft(text) {
    if (document.querySelector('#send').disabled || tripInput.disabled) return;
    tripInput.value = text;
    tripPanel.open = false;
    tripInput.focus();
    tripInput.dispatchEvent(new Event('input', {bubbles: true}));
  }
  document.querySelector('#preset').addEventListener('click', () => {
    fillTripDraft('我们【2人】准备【2026年12月10日】从【福建厦门】出发到【北京】玩【3天】，总预算【3000元】，请帮我们规划行程。');
  });
  tripForm.addEventListener('submit', event => {
    event.preventDefault();
    if (!tripForm.reportValidity()) return;
    const fields = tripForm.elements;
    if (!fields.origin.value.trim() || !fields.destination.value.trim()) {
      document.querySelector('#status').textContent = '请填写出发地和目的地，不能只输入空格。';
      return;
    }
    const [year, month, day] = fields.date.value.split('-');
    fillTripDraft(`我们【${fields.people.value}人】准备【${year}年${Number(month)}月${Number(day)}日】从【${fields.origin.value.trim()}】出发到【${fields.destination.value.trim()}】玩【${fields.days.value}天】，总预算【${fields.budget.value}元】，请帮我们规划行程。`);
  });
</script>
