<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TravelMate · 旅行规划助手</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f5f0; color: #203a32; font: 16px/1.7 system-ui, sans-serif; }
  main { max-width: 820px; margin: auto; padding: 28px 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 26px; }
  .intro { color: #5d7067; margin: 8px 0 24px; }
  button, textarea { font: inherit; }
  button { cursor: pointer; border: 1px solid #bdd0c3; border-radius: 10px; padding: 9px 16px; background: white; color: #244d3e; }
  button:disabled { cursor: wait; opacity: .6; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #82af91; outline-offset: 3px; }
  #messages { min-height: 260px; }
  .message { background: white; border: 1px solid #dce4dc; border-radius: 14px; padding: 16px 20px; margin: 12px 0; overflow-wrap: anywhere; }
  .message.user { background: #e3eee3; margin-left: 32px; }
  .message strong { display: block; font-size: 13px; color: #526d60; }
  .message p { margin: 8px 0 0; white-space: pre-wrap; }
  form { background: white; padding: 16px; border: 1px solid #dce4dc; border-radius: 14px; margin-top: 24px; }
  label { display: block; font-weight: 600; }
  textarea { width: 100%; resize: vertical; min-height: 110px; border: 1px solid #cbd8ce; border-radius: 8px; padding: 10px; margin: 8px 0; color: inherit; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #send { background: #245a44; color: white; border-color: #245a44; }
  #status { font-size: 14px; color: #526d60; }
  footer { margin-top: 16px; font-size: 13px; color: #5d7067; }
  @media (max-width: 480px) { h1 { font-size: 22px; } header { align-items: flex-start; } .message.user { margin-left: 12px; } }
</style>
<main>
  <header><h1>TravelMate <small>旅行助手</small></h1><button id="new" type="button">新对话</button></header>
  <p class="intro">聊聊你想去哪里，我们一起安排下一趟旅行。</p>
  <label for="history">历史对话</label>
  <select id="history" aria-label="选择历史对话"><option value="">新对话</option></select>
  <section id="messages" aria-label="对话内容" role="log" aria-live="polite">
    <article class="message"><strong>TravelMate</strong><p>告诉我出发地、目的地、日期、人数和预算吧。也可以先说说你喜欢怎样的旅行。</p></article>
  </section>
  <form id="form">
    <label for="input">你的旅行想法</label>
    <textarea id="input" maxlength="8000" required placeholder="例如：从上海出发，两个人去杭州玩三天，预算3000元，喜欢自然风景。"></textarea>
    <div class="actions"><span id="status" role="status">准备好了</span><button id="send" type="submit">发送</button></div>
  </form>
  <footer>预算与行程仅供参考，出行前请核实价格和开放时间。对话保存在本地服务中，刷新后可继续。</footer>
</main>
<script>
  const form = document.querySelector('#form');
  const input = document.querySelector('#input');
  const messages = document.querySelector('#messages');
  const status = document.querySelector('#status');
  const send = document.querySelector('#send');
  const newChat = document.querySelector('#new');
  const historySelect = document.querySelector('#history');
  let session;
  try { session = localStorage.getItem('travelmate-session'); } catch {}
  if (!session || !/^[a-zA-Z0-9_-]{1,100}$/.test(session)) session = crypto.randomUUID();
  let busy = false;

  function rememberSession() {
    try { localStorage.setItem('travelmate-session', session); } catch {}
  }

  async function refreshSessions() {
    const response = await fetch('/sessions');
    if (!response.ok) throw new Error('history unavailable');
    const data = await response.json();
    historySelect.replaceChildren(new Option('新对话', ''));
    for (const item of data.sessions) historySelect.add(new Option(item.title, item.session_id));
    historySelect.value = [...historySelect.options].some(o => o.value === session) ? session : '';
  }

  async function loadConversation(id) {
    if (busy) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    status.textContent = '正在恢复对话…';
    try {
      const response = await fetch('/sessions/' + encodeURIComponent(id));
      if (!response.ok) throw new Error('history unavailable');
      const data = await response.json();
      session = id;
      rememberSession();
      messages.replaceChildren();
      for (const item of data.messages) appendMessage(item.role === 'user' ? '你' : 'TravelMate', item.content, item.role === 'user');
      if (!data.messages.length) appendMessage('TravelMate', '告诉我目的地、日期和预算，我们开始规划。');
      status.textContent = data.interrupted ? '上次回复未完成，可继续补充需求。' : '对话已恢复，可以继续聊';
    } catch {
      status.textContent = '历史对话加载失败，请刷新后重试。';
    } finally {
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = false;
    }
  }

  historySelect.addEventListener('change', () => {
    if (historySelect.value) loadConversation(historySelect.value);
    else newChat.click();
  });

  function appendMessage(label, text, user = false) {
    const article = document.createElement('article');
    article.className = user ? 'message user' : 'message';
    const name = document.createElement('strong');
    name.textContent = label;
    const body = document.createElement('p');
    // Model and user content are untrusted; display as plain text.
    body.textContent = text;
    article.append(name, body);
    messages.append(article);
    article.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    return body;
  }

  newChat.addEventListener('click', () => {
    if (busy) return;
    session = crypto.randomUUID();
    rememberSession();
    historySelect.value = '';
    messages.replaceChildren();
    appendMessage('TravelMate', '新的旅行，从哪里开始？');
    status.textContent = '已开始新对话';
    input.focus();
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = newChat.disabled = historySelect.disabled = true;
    input.disabled = true;
    appendMessage('你', text, true);
    status.textContent = '正在整理旅行建议，请稍候…';
    const reply = appendMessage('TravelMate', '');
    let answer = '', messageId = null, done = false;
    try {
      const response = await fetch('/chat/stream', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: session, message: text})
      });
      if (!response.ok) throw new Error('request failed');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const packet = await reader.read();
        buffer += decoder.decode(packet.value, {stream: !packet.done});
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const event = frame.split('\n').find(line => line.startsWith('event: '))?.slice(7);
          const dataLine = frame.split('\n').find(line => line.startsWith('data: '));
          if (!dataLine) continue;
          const data = JSON.parse(dataLine.slice(6));
          if (event === 'error') throw new Error(data.text);
          if (event === 'status') status.textContent = data.text;
          if (event === 'token') {
            if (messageId !== data.id) { answer = ''; messageId = data.id; }
            answer += data.text;
            reply.textContent = answer;
          }
          if (event === 'done') { reply.textContent = data.answer; done = true; }
        }
        if (packet.done) break;
      }
      if (!done) throw new Error('incomplete stream');
      input.value = '';
      status.textContent = '可以继续补充你的想法';
      refreshSessions().catch(() => { status.textContent = '回复已保存，历史列表暂时无法更新。'; });
    } catch {
      if (!reply.textContent) reply.textContent = '未能完成回复。';
      reply.textContent += '\n[本次回复中断]';
      status.textContent = '请求失败，请检查后端配置或网络。输入已保留，可重新发送。';
    } finally {
      busy = false;
      send.disabled = newChat.disabled = historySelect.disabled = input.disabled = false;
      input.focus();
    }
  });
  rememberSession();
  refreshSessions().then(() => loadConversation(session)).catch(() => {
    status.textContent = '历史列表加载失败，请刷新重试。';
  });
</script>
</html>
